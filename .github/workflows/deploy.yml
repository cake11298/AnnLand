name: Test & Deploy to GitHub Pages

# 已改用 `npm run deploy`（推到 gh-pages 分支）部署，這個 workflow 改為只手動觸發。
# 若想改回自動部署：把 Pages Source 設為 GitHub Actions，並把下面的 on: 換成
#   push: { branches: [main, master] }
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
